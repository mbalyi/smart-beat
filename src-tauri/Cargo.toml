[package]
name = "smart-beat"
version = "1.0.0"
description = "Smart Beat desktop app (Tauri core)"
authors = ["Mark Balyi"]
edition = "2024"
rust-version = "1.88"
license = "PolyForm-Noncommercial-1.0.0"
homepage = "https://github.com/mbalyi/smart-beat"
repository = "https://github.com/mbalyi/smart-beat"
publish = false

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows.
name = "smart_beat_lib"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
# Checks TRANSCRIPTION_SERVICE_URL (src/service_url.rs). Already in the tree through Tauri.
url = "2"

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
# In-app updates from GitHub Releases (docs/release.md) and the relaunch after installing one.
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Import from Audio (src/transcription.rs) talks to Smart Beat's MuScriptor server from here,
# so the webview's CSP keeps every remote host out.
base64 = "0.22"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "system-proxy", "multipart"] }
# Already in the tree through Tauri. `time` waits between retries while the server is busy.
tokio = { version = "1.53", default-features = false, features = ["time"] }
# Already in the tree through reqwest. One copy of a recording serves every upload attempt.
bytes = "1"
tempfile = "3"
rustysynth = "1.3"
lewton = "0.10"
cpal = "0.18"
realfft = "3.5"
hound = "3.5"
nam-rs = "0.4"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "wav", "pcm", "flac", "ogg", "vorbis", "aiff"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri-plugin-opener = "2.7"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# Record to tab (src/recording.rs) runs the bundled Basic Pitch model with it. Pure Rust.
tract-onnx = "0.23"

# macOS: the system's AAC encoder (AVFoundation) writes `.m4a` exports (src/m4a.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioBuffer", "AVAudioFile", "AVAudioFormat", "AVAudioSettings", "AVAudioTypes"] }

[dev-dependencies]
# Tests src/service_url.rs, which build.rs includes.
url = "2"
tauri = { version = "2.12", features = ["test"] }
# Decodes the updater public key in tauri.conf.json (tests/updater_config.rs).
base64 = "0.22"
# Decodes the exported `.m4a` in the tests (the app itself only reads the formats above).
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

# The native menu (muda) can only be created on the main thread on macOS, and
# the standard test harness runs tests on other threads: this test has its own
# `main`.
[[test]]
name = "native_menu"
harness = false

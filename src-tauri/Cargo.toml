[package]
name = "smart-beat"
version = "0.1.0"
description = "Smart Beat desktop app (Tauri core)"
authors = ["Mark Balyi"]
edition = "2024"
rust-version = "1.88"
license = "LicenseRef-Proprietary"
publish = false

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows.
name = "smart_beat_lib"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rustysynth = "1.3"
lewton = "0.10"
cpal = "0.18"
realfft = "3.5"
hound = "3.5"
nam-rs = "0.4"

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

# The native menu (muda) can only be created on the main thread on macOS, and
# the standard test harness runs tests on other threads: this test has its own
# `main`.
[[test]]
name = "native_menu"
harness = false

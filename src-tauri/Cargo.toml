[package]
name = "smart-beat"
version = "1.0.1"
description = "Smart Beat desktop app (Tauri core)"
authors = ["Mark Balyi"]
edition = "2024"
rust-version = "1.88"
license = "PolyForm-Noncommercial-1.0.0"
homepage = "https://github.com/mbalyi/smart-beat"
repository = "https://github.com/mbalyi/smart-beat"
publish = false
default-run = "smart-beat"

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows.
name = "smart_beat_lib"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
# Builds the vendored muscriptor.cpp (native/).
cmake = "0.1"

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
# In-app updates from GitHub Releases (docs/release.md) and the relaunch after installing one.
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Import from Audio (src/transcription.rs) returns the MIDI file to the page as base64.
base64 = "0.22"
# Fixed-size host/helper audio mapping; already used transitively by Tauri.
memmap2 = "0.9"
tempfile = "3"
rustysynth = "1.3"
lewton = "0.10"
cpal = "0.18"
realfft = "3.5"
hound = "3.5"
nam-rs = "0.4"
# Third-party plugin hosting (#80): VST3 via vst3-host (MIT) with its
# out-of-process helper, CLAP via clack (MIT OR Apache-2.0) inside the same
# helper. No default features: we use neither crate's audio backend, only
# hosting + isolation (AppKit windowing is used directly, no window-handle interop).
vst3-host = { version = "0.10", default-features = false, features = ["process-isolation"] }
clack-host = "0.2"
clack-extensions = { version = "0.2", features = ["audio-ports", "gui", "latency", "state", "clack-host"] }
symphonia = { version = "0.6", default-features = false, features = ["mp3", "wav", "pcm", "flac", "ogg", "vorbis", "aiff"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri-plugin-opener = "2.7"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# Record to tab (src/recording.rs) runs the bundled Basic Pitch model with it. Pure Rust.
tract-onnx = "0.23"
# Checks the piano model files after the download (src/recording/piano_model.rs).
sha2 = "0.11"
sevenz-rust2 = { version = "0.24", default-features = false }

# macOS: the system's AAC encoder (AVFoundation) writes `.m4a` exports (src/m4a.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioBuffer", "AVAudioFile", "AVAudioFormat", "AVAudioSettings", "AVAudioTypes"] }

[dev-dependencies]
# ABI types for the original synthetic CLAP fixture, built by rustc in tests.
clap-sys = "0.5"
# Tests src/service_url.rs, which build.rs includes.
url = "2"
tauri = { version = "2.12", features = ["test"] }
# Decodes the updater public key in tauri.conf.json (tests/updater_config.rs).
base64 = "0.22"
# Decodes the exported `.m4a` in the tests (the app itself only reads the formats above).
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

# The native menu (muda) can only be created on the main thread on macOS, and
# the standard test harness runs tests on other threads: this test has its own
# `main`.
[[test]]
name = "native_menu"
harness = false

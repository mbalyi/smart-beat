<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Smart Beat – tablature editor with self-hosted AI accompaniment."
    />
    <title>Smart Beat</title>
    <style>
      /* Startup splash: plays until the app has started (see src/main.tsx). */
      /* No white flash while the page and the video load. */
      :root:has(#splash) {
        background: #000;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      #splash.done {
        opacity: 0;
      }
      #splash video {
        width: min(70vmin, 420px);
        height: auto;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true" inert>
      <video src="/loading.mp4" muted loop playsinline preload="auto"></video>
    </div>
    <script>
      // Start the animation ourselves: WebKit ignores the muted attribute on
      // parse and then blocks autoplay (showing a play button). If it still
      // can't play, skip the splash rather than show a dead video.
      (function () {
        var video = document.querySelector("#splash video");
        if (!video) return;
        video.muted = true;
        video.defaultMuted = true;
        video.controls = false;
        var skip = function () {
          var splash = document.getElementById("splash");
          if (splash) splash.remove();
        };
        // The animation must be seen once in full: main.tsx counts from here.
        video.addEventListener(
          "playing",
          function () {
            window.__splashPlayingAt = performance.now();
          },
          { once: true },
        );
        var started = video.play();
        if (started && started.catch) started.catch(skip);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

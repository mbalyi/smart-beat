<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Smart Beat is a free tablature editor for musicians and learners on macOS, Windows and Linux. Record your ideas, get the band together with in-person and online jamming, and practice with optional, self-hosted AI tools too."
    />
    <title>Smart Beat</title>
    <style>
      /* Startup splash (#53): black from the first frame, the animated logo on top
         until the app is ready (see src/lib/splash.ts). */
      html:has(#splash),
      html:has(#splash) body {
        background: #000;
        /* No scrollbar behind the logo: the page is not meant to scroll yet. */
        overflow: hidden;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      #splash.done {
        opacity: 0;
      }
      #splash img {
        width: min(70vmin, 420px);
        height: auto;
        aspect-ratio: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true" inert>
      <img src="/splash.webp" alt="" width="512" height="512" decoding="async" />
    </div>
    <script>
      // The splash counts from here; if the animation cannot load, the still logo shows.
      (function () {
        window.__splashShownAt = performance.now();
        var image = document.querySelector("#splash img");
        if (!image) return;
        image.addEventListener(
          "error",
          function () {
            if (!/splash\.png$/.test(image.src)) image.src = "/splash.png";
          },
          { once: true },
        );
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name = "smart-beat-signaling"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# One Durable Object per room. It holds the two setup mailboxes in memory for ten minutes.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# No secrets, no database, no logs of room codes.

# Rooms per address: every room is a Durable Object with an alarm, so one address may make ten
# a minute. The Worker reads this as `env.CREATE_LIMIT` (and works without it, as in the tests).
[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

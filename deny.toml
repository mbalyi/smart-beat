# cargo-deny: dependency policy for the Rust core (run `pnpm licenses:check`).
# Rationale: docs/licensing.md. Keep in sync with about.toml.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[licenses]
# Smart Beat's source is under PolyForm Noncommercial and its binaries may be sold under a
# separate commercial license (ADR 0002), so only permissive licenses and MPL-2.0 (file-level
# copyleft, fine for unmodified crates) are allowed.
# Rust links statically, so LGPL/GPL/AGPL crates are not allowed at all.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The allowlist is policy, not an inventory: not every license is in use yet.
unused-allowed-license = "allow"

[licenses.private]
# Our own crate is under PolyForm Noncommercial, which is not an allowed dependency license
# (publish = false).
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Only flag unmaintained crates we depend on directly; Tauri's transitive
# GTK 3 bindings are tracked upstream.
unmaintained = "workspace"
# zip 4.6.1 comes only from tauri-plugin-updater (2.13 and 2.14 both pin it). These advisories are
# about `ZipArchive::extract` on untrusted archives; the updater only unpacks update bundles whose
# minisign signature it has already verified. Remove these when the plugin moves to zip >= 9.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip 4.6.1 via tauri-plugin-updater: signature-verified update bundles only" },
    { id = "RUSTSEC-2026-0368", reason = "zip 4.6.1 via tauri-plugin-updater: signature-verified update bundles only" },
    { id = "RUSTSEC-2026-0369", reason = "zip 4.6.1 via tauri-plugin-updater: signature-verified update bundles only" },
]

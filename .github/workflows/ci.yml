name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  web:
    name: Web (lint, types, unit + integration)
    # Self-hosted on the maintainer's Mac while the repo is private (GitHub-hosted minutes ran out).
    # Switch back to GitHub-hosted runners (ubuntu-latest / macos-latest) when the repo goes public.
    runs-on: ${{ fromJSON('["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Unit + integration tests (Vitest, with coverage)
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  browser:
    # One runner per browser: the tests play real audio and render in software,
    # and two browsers sharing a 2-core runner starve each other (see
    # playwright.config.ts).
    name: Browser (${{ matrix.browser }})
    runs-on: ${{ fromJSON('["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Browser integration tests (Playwright + axe)
        run: pnpm test:e2e --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

  native:
    name: Native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # Windows and Linux are switched off for pull requests and pushes: they only run when
        # started by hand (Actions > CI > Run workflow). To switch them on again, replace this
        # expression by the full list.
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"name":"macOS","os":"macos-latest"},{"name":"Windows","os":"windows-latest"},{"name":"Linux","os":"ubuntu-22.04"}]' || '[{"name":"macOS","os":"macos-latest"}]') }}
    runs-on: ${{ matrix.os == 'macos-latest' && fromJSON('["self-hosted","macOS","ARM64"]') || matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: src-tauri -> target

      - uses: taiki-e/install-action@v2
        if: runner.environment == 'github-hosted'
        with:
          tool: cargo-about

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rust format
        if: runner.os == 'Linux'
        run: pnpm rust:fmt

      - name: Rust lint (clippy)
        if: runner.os == 'Linux'
        run: pnpm rust:lint

      - name: Rust unit + integration tests
        run: pnpm rust:test

      - name: Web tests on this OS
        run: pnpm test

      - name: Build app (compile only, no installer)
        run: pnpm tauri build --ci --no-bundle

  licenses:
    name: License policy
    runs-on: ${{ fromJSON('["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: npm packages
        run: node scripts/check-licenses.mjs

      - name: Rust crates (licenses, bans, sources, advisories)
        # cargo-deny-action is a Docker action and cannot run on the macOS runner.
        run: cargo deny --manifest-path src-tauri/Cargo.toml check licenses bans sources advisories

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  web:
    name: Web (lint, types, unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Unit + integration tests (Vitest, with coverage)
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    # The browser integration tests, one job per group and browser: the groups are defined in
    # e2e/groups.ts (the `smoke-*` themes are the core flows, the rest are feature groups), so a
    # slow group never runs out of time. The tests play real audio and render in software (WebKit),
    # so every job has its own runner. `workers` is how many tests run at once inside a job: the runner of a public
    # repo has 4 vCPUs. A group that flakes with two goes back to one here. Keep the group ids equal
    # to CI_GROUPS in e2e/groups.ts (scripts/e2e-groups.test.mjs checks it), and the check names
    # below in the "Protect main" ruleset.
    name: E2E ${{ matrix.group.title }} (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # The official Playwright image has the browsers and their system libraries, so nothing is
    # installed from the Ubuntu mirror (which once stalled for an hour). Keep the tag equal to the
    # exact @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        group:
          # One worker: the core flows include tests of real-time playback, which a second test
          # running at once pushes past their tolerance (score.spec.ts "keeps real time").
          - { id: smoke-ui, title: smoke UI tests, workers: 1 }
          - { id: smoke-files, title: smoke files tests, workers: 1 }
          - { id: smoke-score, title: smoke score tests, workers: 1 }
          - { id: smoke-drums, title: smoke drums tests, workers: 1 }
          - { id: smoke-sound, title: smoke sound tests, workers: 1 }
          - { id: smoke-practice, title: smoke practice tests, workers: 1 }
          - { id: smoke-app, title: smoke app tests, workers: 1 }
          - { id: record-import, title: Record to tab and Import from Audio, workers: 2 }
          - { id: stems, title: stem separation, workers: 2 }
          - { id: practice-together, title: Practice together, workers: 2 }
          - { id: audio-lanes, title: audio lanes, workers: 2 }
          - { id: edit, title: edit tests, workers: 2 }
          - { id: tours, title: guided tours, workers: 2 }
          - { id: ai-dialogs, title: AI installer and model dialogs, workers: 2 }
          - { id: cloud-share, title: cloud share, workers: 2 }
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Browser integration tests (Playwright + axe)
        run: pnpm test:e2e --project=${{ matrix.browser }}
        env:
          E2E_GROUP: ${{ matrix.group.id }}
          E2E_WORKERS: ${{ matrix.group.workers }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.group.id }}-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

  native:
    name: Native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    # Windows took 43 minutes to compile and test, then hit 45 minutes saving its cache, so it gets
    # 90. macOS and Linux get 75 to cover a cold cache.
    timeout-minutes: ${{ matrix.name == 'Windows' && 90 || 75 }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rust format
        if: runner.os == 'Linux'
        run: pnpm rust:fmt

      - name: Rust lint (clippy)
        if: runner.os == 'Linux'
        run: pnpm rust:lint

      - name: Rust unit + integration tests
        run: pnpm rust:test

      - name: Web tests on this OS
        run: pnpm test

      - name: Build app (compile only, no installer)
        run: pnpm tauri build --ci --no-bundle

  licenses:
    name: License policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: npm packages
        run: node scripts/check-licenses.mjs

      - name: Rust crates (licenses, bans, sources, advisories)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses bans sources advisories

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the working tree and every commit
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          # Download to a file first so curl can retry a flaky GitHub download (a 504 once failed this job).
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/gitleaks.tar.gz" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact --no-banner .
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner .

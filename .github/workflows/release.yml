name: Release

# Builds installers for macOS (.dmg, universal), Windows (.msi, .exe) and
# Linux (.AppImage, .deb, .rpm).
# - Push a `v*` tag (e.g. `v0.2.0`, matching package.json) to create a draft
#   GitHub Release with the installers attached.
# - Run manually to build installers as workflow artifacts only.
# - PRs that change packaging configuration also build the installers (as
#   artifacts, never a release) so bundling problems surface before a tag.
# Signing turns on automatically once the secrets in docs/code-signing.md exist.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
      - src-tauri/icons/**
      - EULA.md
  workflow_dispatch:
    inputs:
      draft-release:
        description: Also create a draft GitHub Release
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  installers:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and Linux installers are not built for pull requests that touch the packaging
        # files: they are built for release tags and when the workflow is started by hand. To build
        # them for pull requests again, replace this expression by the full list.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"macOS (universal)","os":"macos-latest","rust-targets":"aarch64-apple-darwin,x86_64-apple-darwin","tauri-args":"--target universal-apple-darwin"}]' || '[{"name":"macOS (universal)","os":"macos-latest","rust-targets":"aarch64-apple-darwin,x86_64-apple-darwin","tauri-args":"--target universal-apple-darwin"},{"name":"Windows (x64)","os":"windows-latest","rust-targets":"","tauri-args":""},{"name":"Linux (x64)","os":"ubuntu-22.04","rust-targets":"","tauri-args":""}]') }}
    # Self-hosted on the maintainer's Mac while the repo is private (GitHub-hosted minutes ran out).
    # Switch back to GitHub-hosted runners (ubuntu-latest / macos-latest) when the repo goes public.
    runs-on: ${{ matrix.os == 'macos-latest' && fromJSON('["self-hosted","macOS","ARM64"]') || matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: src-tauri -> target

      - uses: taiki-e/install-action@v2
        if: runner.environment == 'github-hosted'
        with:
          tool: cargo-about

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # No dependency cache for release builds (cache-poisoning hardening).
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Configure Apple signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # Only export what is configured: Tauri treats a present-but-empty
          # variable as "sign with this", which would fail the build.
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::Apple signing secrets are not set. Building an ad-hoc signed app that is NOT notarized (see docs/code-signing.md)."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
            {
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$key_path"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::App Store Connect API key not set: the app will be signed but not notarized."
          fi

      - name: Build installers
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.tauri-args }}
          # A release is only created for tags, or when requested manually.
          tagName: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.draft-release) && 'v__VERSION__' || '' }}
          releaseName: Smart Beat v__VERSION__
          releaseBody: See the assets below to download Smart Beat for your platform.
          releaseDraft: true
          prerelease: false

      - name: Check that license notices were bundled
        shell: bash
        run: test -s public/third-party-licenses.txt

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm

name: Release

# Builds installers for macOS (.dmg, universal), Windows (.msi, .exe) and
# Linux (.AppImage, .deb, .rpm).
# - Push a `v*` tag (e.g. `v0.2.0`, matching package.json) to create a draft
#   GitHub Release with the installers attached.
# - Run manually to build installers as workflow artifacts only.
# - PRs that change packaging configuration also build the installers (as
#   artifacts, never a release) so bundling problems surface before a tag.
# - Release builds also create signed updater bundles and a `latest.json` that the in-app
#   updater reads. That needs the TAURI_SIGNING_PRIVATE_KEY secret (docs/release.md); a build
#   for a release fails without it, other builds just skip the updater bundles.
# Apple signing turns on automatically once the secrets in docs/code-signing.md exist.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
      - src-tauri/icons/**
      - EULA.md
  workflow_dispatch:
    inputs:
      draft-release:
        description: Also create a draft GitHub Release
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  installers:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
            installer: dmg
          - name: Windows (x64)
            os: windows-latest
            rust-targets: ""
            tauri-args: ""
            installer: windows
          - name: Linux (x64)
            os: ubuntu-22.04
            rust-targets: ""
            tauri-args: ""
            installer: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # No dependency cache for release builds (cache-poisoning hardening).
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Configure Apple signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # Only export what is configured: Tauri treats a present-but-empty
          # variable as "sign with this", which would fail the build.
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::Apple signing secrets are not set. Building an ad-hoc signed app that is NOT notarized (see docs/code-signing.md)."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
            {
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$key_path"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::App Store Connect API key not set: the app will be signed but not notarized."
          fi

      - name: Release tag and notes
        id: release
        # A release is only created for tags, or when requested manually.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.draft-release
        shell: bash
        run: |
          # One canonical version: the tag must be v<version in package.json>, and CHANGELOG.md
          # needs a section for it (that text becomes the release notes and the update dialog).
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          node scripts/release-notes.mjs "$tag" --check
          # package.json, Cargo.toml and Cargo.lock must all carry this version.
          node scripts/version.mjs check --tag "$tag"
          # The key in the repository while the updater was built (key id 4787392BA11701D4) is a
          # throwaway one: apps built with it could never be updated by the real key.
          if grep -q "IDQ3ODczOTJCQTExNzAxRDQK" src-tauri/tauri.conf.json; then
            echo "::error::plugins.updater.pubkey in tauri.conf.json is still the development key. Put the public key of the real updater key in it (docs/release.md)."
            exit 1
          fi
          {
            echo "tag=$tag"
            # 0.2.0-beta.1 and the like are GitHub prereleases, which releases/latest (and so the
            # updater's latest.json) never points at: they cannot reach the stable channel.
            node -e 'import("./scripts/release-lib.mjs").then((m) => console.log(`prerelease=${m.isPrerelease(process.argv[1])}`))' "$tag"
            echo "body<<RELEASE_NOTES_EOF"
            node scripts/release-notes.mjs "$tag"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Configure updater signing
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          # The overlay turns on bundle.createUpdaterArtifacts, which needs the private key.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          elif [ -n "$RELEASE_TAG" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set, so $RELEASE_TAG would have no updater bundles. Add the secrets described in docs/release.md."
            exit 1
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without updater bundles."
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installers
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Anonymous usage counters (docs/analytics.md). The installer type is baked into the
          # build; pull-request builds get no address, which turns the counters off in them.
          SMART_BEAT_INSTALLER: ${{ matrix.installer }}
          SMART_BEAT_ANALYTICS_URL: ${{ github.event_name != 'pull_request' && vars.ANALYTICS_URL || '' }}
        with:
          args: ${{ matrix.tauri-args }} ${{ steps.updater.outputs.args }}
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: Smart Beat v__VERSION__
          releaseBody: ${{ steps.release.outputs.body }}
          releaseDraft: true
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          # Stable names without the version, so the website can link to
          # https://github.com/mbalyi/smart-beat/releases/latest/download/<name> (docs/release.md).
          releaseAssetNamePattern: SmartBeat_[platform]_[arch][setup][ext]

      - name: Check that license notices were bundled
        shell: bash
        run: test -s public/third-party-licenses.txt

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.sig

  verify-release:
    name: Check the draft release
    needs: installers
    if: startsWith(github.ref, 'refs/tags/v') || inputs.draft-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: List the assets and check latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          # Drafts are not found by tag, so list all releases.
          release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" | jq -s --arg tag "$tag" 'add | map(select(.tag_name == $tag)) | .[0]')
          if [ "$release" = "null" ]; then
            echo "::error::No release for $tag was found."
            exit 1
          fi
          echo "Assets of $tag:"
          echo "$release" | jq -r '.assets[].name' | sort
          id=$(echo "$release" | jq -r '.assets[] | select(.name == "latest.json") | .id')
          if [ -z "$id" ]; then
            echo "::error::latest.json was not uploaded to $tag."
            exit 1
          fi
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$RUNNER_TEMP/latest.json"
          # tauri-action writes API asset URLs while the release is a draft; the updater needs
          # the public download URLs.
          echo "$release" | jq '[.assets[] | {id, name}]' > "$RUNNER_TEMP/assets.json"
          node scripts/fix-latest-json.mjs "$tag" "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/assets.json"
          gh release upload "$tag" "$RUNNER_TEMP/latest.json" --repo "$GITHUB_REPOSITORY" --clobber
          node scripts/verify-latest-json.mjs "$tag" "$RUNNER_TEMP/latest.json"

      - name: Add versioned copies of the installers
        # The stable names (SmartBeat_macos_universal.dmg) keep the website's
        # releases/latest/download links working; the copies carry the version
        # (SmartBeat-0.2.0-macOS-universal.dmg) for people who keep several versions.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          dir="$RUNNER_TEMP/installers"
          mkdir -p "$dir"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dir" \
            --pattern '*.dmg' --pattern '*.exe' --pattern '*.msi' \
            --pattern '*.AppImage' --pattern '*.deb' --pattern '*.rpm'
          for file in "$dir"/*; do
            name=$(node -e 'import("./scripts/release-lib.mjs").then((m) => console.log(m.versionedAssetName(process.argv[1], process.argv[2]) ?? ""))' "$(basename "$file")" "${tag#v}")
            [ -n "$name" ] || continue
            echo "$(basename "$file") -> $name"
            mkdir -p "$dir/versioned"
            cp "$file" "$dir/versioned/$name"
            gh release upload "$tag" "$dir/versioned/$name" --repo "$GITHUB_REPOSITORY" --clobber
          done
